# Candidate configuration based on user-provided RS PS6 Pool-Spa model.
# Panel revision and circuit mapping remain UNVERIFIED.
listen_address = http://0.0.0.0:80
serial_port = /dev/ttyUSB0
web_directory = /var/www/aqualinkd/
log_level = NOTICE
panel_type = RS-6 Combo
device_id = 0xFF
ftdi_low_latency = YES
# Existing Jandy schedules remain the source of operating schedules.
enable_scheduler = no
sync_panel_time = no
# Preserve board freeze-protection behavior.
override_freeze_protect = no
display_warnings_in_web = yes
# No VSP, heater, chemical feeder, or auxiliary assignments are assumed.
