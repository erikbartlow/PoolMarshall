<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoolMarshall License</title>
<style>body{font:16px system-ui;background:#071d2b;color:#eef8fc;margin:0;padding:32px}main{max-width:650px;margin:5vh auto}a{color:#67d9df}textarea{box-sizing:border-box;width:100%;min-height:150px;margin:12px 0;padding:12px}button{padding:12px 24px;cursor:pointer}p{line-height:1.6}#message{white-space:pre-line}</style>
<main><h1>PoolMarshall License</h1><p>PoolMarshall v{{VERSION}}</p><p id="status" role="status">Loading license status…</p><p id="details"></p>
<form id="activate"><label for="key">License key</label><textarea id="key" required maxlength="4096" autocomplete="off" spellcheck="false"></textarea><button id="submit">Activate license</button></form><p id="message" role="alert"></p><a href="/">Return to dashboard</a><p>Minor and build updates are included. A newer major version requires a new license. Trial keys provide 30 days from first activation on this installation.</p></main>
<script>
const status=document.getElementById('status'),details=document.getElementById('details'),message=document.getElementById('message');
function show(s){status.textContent=s.message;details.textContent=s.customer?`${s.customer} · Purchased version ${s.purchasedVersion}${s.trialExpiresAt?' · Trial ends '+new Date(s.trialExpiresAt*1000).toLocaleString():''}`:'';}
async function load(){try{const r=await fetch('/api/license');if(r.status===401){location.replace('/login');return;}if(!r.ok)throw Error('Unable to load license status.');show(await r.json());}catch(e){status.textContent=e.message;}}load();
document.getElementById('activate').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;message.textContent='';try{const r=await fetch('/api/license',{method:'PUT',headers:{'Content-Type':'application/json','X-Poolside-Write':'1'},body:JSON.stringify({key:document.getElementById('key').value})});if(r.status===401){location.replace('/login');return;}const s=await r.json();if(!r.ok)throw Error(s.error||'Activation failed.');show(s);message.textContent=s.isValid?'License activated. Return to the dashboard to continue.':s.message;document.getElementById('key').value='';}catch(e){message.textContent=e.message;}finally{b.disabled=false;}};
</script></html>
